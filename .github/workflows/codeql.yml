name: "CodeQL & Tests"

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    # Run quarterly: Jan, Apr, Jul, Oct at 00:00 UTC on the 1st
    - cron: '0 0 1 1,4,7,10 *'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CodeQL Python analysis runs on ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # CodeQL must be initialized BEFORE running the code/tests
      # so it can instrument and capture analysis data during execution
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo "No manual build required for Python."
          exit 0

      - name: Run tests with pytest
        run: |
          pytest tests/ -v

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
